name: Release

on:
  push:
    branches: [main]

# Pushing, the version PR, tags and releases use RELEASE_TOKEN, so GITHUB_TOKEN only needs
# id-token for npm trusted publishing
permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Node 24 ships npm 11.5.1 or later, which npm trusted publishing requires
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Opens or updates the version PR while changesets are pending; otherwise publishes
      # any version not yet on npm, then tags it and creates a GitHub release.
      # RELEASE_TOKEN is a maintainer's fine-grained token for this repository only, with
      # Contents and Pull requests read and write. The version PR and its commit are then
      # authored by that maintainer, not github-actions[bot], and the PR triggers CI as usual
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          version-script: pnpm changeset version
          publish-script: pnpm changeset publish
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
